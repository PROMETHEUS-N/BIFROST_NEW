
  deploy-rbac:
    name: Deploy RBAC assignments
    runs-on: [self-hosted, X64, Windows]
    needs: deploy-vm
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Process all RBAC scopes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $az = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"
          $cfg = Get-Content "input.json" -Raw | ConvertFrom-Json

          $results = [System.Collections.Generic.List[object]]::new()

          function Add-Result {
            param(
              [string]$Scope,
              [string]$Target,
              [string]$Principal,
              [string]$Role,
              [string]$Status,
              [string]$AssignmentId = "",
              [string]$ErrorMessage = ""
            )

            $results.Add([PSCustomObject]@{
              Scope = $Scope
              Target = $Target
              Principal = $Principal
              Role = $Role
              Status = $Status
              AssignmentId = $AssignmentId
              Error = $ErrorMessage
            })
          }

          function Resolve-Principal {
            param($Access)

            if ([string]::IsNullOrWhiteSpace($Access.principalEmail)) {
              throw "principalEmail is required."
            }

            if ($Access.principalType -ne "User") {
              throw "Currently only User principal lookup is implemented."
            }

            $id = & $az ad user show `
              --id $Access.principalEmail `
              --query id -o tsv

            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($id)) {
              throw "Unable to resolve Entra user: $($Access.principalEmail)"
            }

            return $id.Trim()
          }

          function Invoke-RbacAssignment {
            param(
              [string]$Scope,
              [string]$Template,
              [string]$DeploymentScope,
              [string]$Target,
              $Access,
              [hashtable]$ExtraParameters = @{},
              [string]$Location = ""
            )

            try {

              $principalId = Resolve-Principal $Access

              if ([string]::IsNullOrWhiteSpace($Access.roleDefinitionGuid)) {
                throw "roleDefinitionGuid is required."
              }

              $parameters = @{
                principalId = $principalId
                roleDefinitionGuid = $Access.roleDefinitionGuid
                principalType = $Access.principalType
              }

              foreach ($key in $ExtraParameters.Keys) {
                $parameters[$key] = $ExtraParameters[$key]
              }

              $deploymentParameters = @{
                '$schema' = 'https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#'
                contentVersion = '1.0.0.0'
                parameters = @{}
              }

              foreach ($key in $parameters.Keys) {
                $deploymentParameters.parameters[$key] = @{
                  value = $parameters[$key]
                }
              }

              $parameterFile = Join-Path `
                $env:RUNNER_TEMP `
                "rbac-$([guid]::NewGuid()).json"

              $deploymentParameters |
                ConvertTo-Json -Depth 30 |
                Set-Content -Path $parameterFile -Encoding utf8

              $deploymentName = "rbac-$Scope-${{ github.run_id }}-$([guid]::NewGuid().ToString('N').Substring(0,8))"

              # WHAT-IF

              $whatIfArgs = @(
                "deployment"
                $DeploymentScope
                "what-if"
                "--name"
                "$deploymentName-preview"
                "--template-file"
                $Template
                "--parameters"
                "@$parameterFile"
              )

              if ($DeploymentScope -eq "sub") {
                $whatIfArgs += @("--location", $Location)
              }
              else {
                $whatIfArgs += @("--resource-group", $Target)
              }

              & $az @whatIfArgs

              if ($LASTEXITCODE -ne 0) {
                throw "What-If failed."
              }

              # DEPLOYMENT

              $createArgs = @(
                "deployment"
                $DeploymentScope
                "create"
                "--name"
                $deploymentName
                "--template-file"
                $Template
                "--parameters"
                "@$parameterFile"
                "--output"
                "json"
              )

              if ($DeploymentScope -eq "sub") {
                $createArgs += @("--location", $Location)
              }
              else {
                $createArgs += @("--resource-group", $Target)
              }

              $output = & $az @createArgs

              if ($LASTEXITCODE -ne 0) {
                throw "Azure deployment failed."
              }

              $deploymentResult = ($output -join "`n") | ConvertFrom-Json

              $assignmentId = $deploymentResult.properties.outputs.roleAssignmentId.value

              Add-Result `
                -Scope $Scope `
                -Target $Target `
                -Principal $Access.principalEmail `
                -Role $Access.roleDefinitionName `
                -Status "DEPLOYED" `
                -AssignmentId $assignmentId

              Write-Host "$Scope assignment completed."

            }
            catch {

              Add-Result `
                -Scope $Scope `
                -Target $Target `
                -Principal $Access.principalEmail `
                -Role $Access.roleDefinitionName `
                -Status "FAILED" `
                -ErrorMessage $_.Exception.Message

              Write-Warning "$Scope assignment failed: $($_.Exception.Message)"
            }
          }

          # =========================================
          # 1. SUBSCRIPTION SCOPE
          # =========================================

          $subscriptionAccess = @($cfg.rbac.subscriptionAccess)

          if ($subscriptionAccess.Count -eq 0) {
            Write-Host "No subscription RBAC entries. Skipping."
          }

          foreach ($access in $subscriptionAccess) {

            Invoke-RbacAssignment `
              -Scope "subscription" `
              -Template "modules/RBAC/RBAC_subscription.bicep" `
              -DeploymentScope "sub" `
              -Target "Subscription" `
              -Access $access `
              -Location $cfg.deployment.location
          }

          # =========================================
          # 2. RESOURCE GROUP SCOPE
          # =========================================

          $resourceGroupAccess = @($cfg.rbac.resourceGroupAccess)

          if ($resourceGroupAccess.Count -eq 0) {
            Write-Host "No resource-group RBAC entries. Skipping."
          }

          foreach ($access in $resourceGroupAccess) {

            $target = @(
              $cfg.landingZones.resourceGroups |
              Where-Object {
                $_.rgName -eq $access.resourceGroupName
              }
            )

            if ($target.Count -ne 1) {

              Add-Result `
                -Scope "resource-group" `
                -Target $access.resourceGroupName `
                -Principal $access.principalEmail `
                -Role $access.roleDefinitionName `
                -Status "FAILED" `
                -ErrorMessage "Resource group not found or ambiguous."

              continue
            }

            Invoke-RbacAssignment `
              -Scope "resource-group" `
              -Template "modules/RBAC/RBAC_resource_group.bicep" `
              -DeploymentScope "group" `
              -Target $access.resourceGroupName `
              -Access $access
          }

          # =========================================
          # 3. RESOURCE SCOPE
          # =========================================

          $resourceAccess = @($cfg.rbac.resourceAccess)

          if ($resourceAccess.Count -eq 0) {
            Write-Host "No resource-level RBAC entries. Skipping."
          }

          foreach ($access in $resourceAccess) {

            if ($access.resourceType -ne "Microsoft.Storage/storageAccounts") {

              Add-Result `
                -Scope "resource" `
                -Target $access.resourceName `
                -Principal $access.principalEmail `
                -Role $access.roleDefinitionName `
                -Status "FAILED" `
                -ErrorMessage "Unsupported resource type."

              continue
            }

            $targetRg = @(
              $cfg.landingZones.resourceGroups |
              Where-Object {
                $_.rgName -eq $access.resourceGroupName
              }
            )

            $targetResource = @(
              $cfg.landingZones.storageAccounts |
              Where-Object {
                $_.name -eq $access.resourceName -and
                $_.resourceGroupName -eq $access.resourceGroupName
              }
            )

            if ($targetRg.Count -ne 1 -or $targetResource.Count -ne 1) {

              Add-Result `
                -Scope "resource" `
                -Target $access.resourceName `
                -Principal $access.principalEmail `
                -Role $access.roleDefinitionName `
                -Status "FAILED" `
                -ErrorMessage "Target resource or resource group not found in input.json."

              continue
            }

            Invoke-RbacAssignment `
              -Scope "resource" `
              -Template "modules/RBAC/RBAC_resource.bicep" `
              -DeploymentScope "group" `
              -Target $access.resourceGroupName `
              -Access $access `
              -ExtraParameters @{
                storageAccountName = $access.resourceName
              }
          }

          # =========================================
          # FINAL RESULTS
          # =========================================

          $resultFile = "$env:RUNNER_TEMP\rbac-results.json"

          $results |
            ConvertTo-Json -Depth 30 |
            Set-Content -Path $resultFile -Encoding utf8

          $results |
            Format-Table Scope, Target, Principal, Role, Status -AutoSize

          $failed = @(
            $results | Where-Object { $_.Status -eq "FAILED" }
          )

          Write-Host "Total assignments: $($results.Count)"
          Write-Host "Failed assignments: $($failed.Count)"

          if ($failed.Count -gt 0) {
            throw "One or more RBAC assignments failed."
          }

      - name: Upload RBAC result report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RBAC-Deployment-Results-${{ github.run_id }}
          path: ${{ runner.temp }}/rbac-results.json
          if-no-files-found: warn
          retention-days: 30
